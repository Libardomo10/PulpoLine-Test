<div class="w-80 mx-auto mt-4 p-4 bg-white shadow-md rounded-md">
    <h2 class="text-lg font-bold text-center mb-2">{{'FAVORITES' | translate}}</h2>

    <ul *ngIf="favoriteCities.length > 0; else noFavorites">
        <li *ngFor="let city of paginatedCities()" class="flex justify-between items-center p-2 border-b">
            <span>{{ city }}</span>
            <button (click)="removeFavorite(city)" class="text-red-500 hover:text-red-700">
                <i class="fa-solid fa-x"></i>
            </button>
        </li>
    </ul>

    <!-- Paginación -->
    <div *ngIf="totalPages > 1" class="flex justify-between items-center mt-3">
        <button (click)="prevPage()" [disabled]="currentPage === 1"
            class="px-3 py-1 text-sm bg-gray-200 rounded-md hover:bg-gray-300 disabled:opacity-50">
            {{'PREV' | translate}}
        </button>
        <span class="text-sm">{{'PAGE' | translate}} {{ currentPage }} of {{ totalPages }}</span>
        <button (click)="nextPage()" [disabled]="currentPage === totalPages"
            class="px-3 py-1 text-sm bg-gray-200 rounded-md hover:bg-gray-300 disabled:opacity-50">
            {{'NEXT' | translate}}
        </button>
    </div>

    <ng-template #noFavorites>
        <p class="text-gray-500 text-center">{{'NO_FAVORITES' | translate}}</p>
    </ng-template>
</div>
